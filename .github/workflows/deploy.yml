name: Deploy to Elastic Beanstalk

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Corretto)
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'

      - name: Build WAR
        run: mvn clean package -DskipTests

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: eb-java-demo-deploy

      - name: Generate version label
        id: version
        run: |
          VERSION_LABEL="v1.0-$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          echo "label=$VERSION_LABEL" >> $GITHUB_OUTPUT

      - name: Upload WAR to S3
        run: |
          aws s3 cp target/eb-java-demo.war s3://${{ secrets.S3_BUCKET }}/${{ steps.version.outputs.label }}.war

      - name: Create Elastic Beanstalk application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name ${{ secrets.EB_APP_NAME }} \
            --version-label ${{ steps.version.outputs.label }} \
            --source-bundle S3Bucket=${{ secrets.S3_BUCKET }},S3Key=${{ steps.version.outputs.label }}.war

      - name: Deploy to Elastic Beanstalk environment
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name ${{ secrets.EB_ENV_NAME }} \
            --version-label ${{ steps.version.outputs.label }}
